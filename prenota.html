<!DOCTYPE HTML>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title> Concessionario Paolini - Prenota </title>

        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <div class="page-container">
            <header>
                <nav>
                    <h1> Concessionario Paolini </h1>

                    <ul type="none">
                        <li><a href="index.html"> Home </a></li>
                        <li><a href="menu.html"> Menu </a></li>
                        <li><a href="prenota.html"> Prenota </a></li>
                    </ul>
                </nav>
            </header>

            <main>
                <section>
                    <form action="POST">
                        <div>
                            <label for="nome"> Nome: </label>
                            <input type="text" id="nome" name="nome" placeholder="Es. Mario" required>
                        </div>

                        <div>
                            <label for="cognome"> Cognome: </label>
                            <input type="text" id="cognome" name="cognome" placeholder="Es. Rossi" required>
                        </div>

                        <div>
                            <label for="email"> Email: </label>
                            <input type="email" id="email" name="email" placeholder="Es. esempio@provider.com" required>
                        </div>

                        <div>
                            <label for="newsletter"> Voglio iscrivermi alla newsletter </label>
                            <input type="checkbox" id="newsletter" name="newsletter">
                        </div>

                        <input type="submit" id="submit" name="submit">
                    </form>
                </section>
            </main>

            <footer>
                <h2 class="footer-copyright"> Concessionario Paolini. Tutti i diritti riservati. </h2>
            </footer>
        </div>
    </body>
</html>
