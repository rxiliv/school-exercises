<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 01 Basics - Portfolio </title>

    <style>
        body {
            font-family: Helvetica, Arial, Sans-Serif;
            background-color: #f5eec5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* orizzontale */
            /* align-items: center;     verticale */
            padding-top: 48px;
        }

        h2 {
            color: #a12d46;
            margin: 0 0 5px 0; /* senso orario da su */
        }

        hr {
            border: 0;
            border-top: 1px solid #e4bdbd;
            margin: 20px 0; /* assi y x */
        }

        .profile-card {
            background-color: #fffdf0;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 8px #eccaa3; /* offset x, offset y, blur, colore */
            padding: 32px;
            text-align: center;
            border-radius: 16px;
            box-sizing: border-box;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #a12d46;
            margin-bottom: 16px;
        }

        .subtitle {
            color: #4b061b;
            margin-top: 0;
            margin-bottom: 20px;
        }

        h4 {
            text-align: left;
            color: #a12d46;
        }

        table {
            width: 100%;
            margin-top: 16px;
            text-align: left;
            border-collapse: collapse;
        }

        thead {
            background-color: #4b061b;
            color: #fffdf0;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e4bdbd;
        }

        tbody tr:nth-child(even) {
            background-color: #f0ddd3;
        }

        tbody tr:hover {
            background-color: #c46a78;
            cursor: pointer;
        }

        .btn-contattami {
            display: inline-block;
            background-color: #a12d46;
            color: #f0ddd3;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            margin-top: 24px;
            padding: 12px 20px;
        }
    </style>

</head>
<body>
    <div class="profile-card">
        <img src="https://picsum.photos/200" alt="Foto profilo" class="profile-img">
        <h2> Gioia Chen </h2> <!-- numero = importanza a livello semantico del testo -->
        <p class="subtitle"> Studente di Informatica </p>

        <hr>

        <h4> Competenze acquisite: </h4>

        <table>
            <thead>
                <tr>
                    <th> Materia </th>
                    <th> Livello </th>
                    <th> Voto atteso </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td> HTML5 & CSS3 </td>
                    <td> Avanzato </td>
                    <td> 9 </td>
                </tr>
                    <td> Java </td>
                    <td> Intermedio </td>
                    <td> 8.5 </td>
                <tr>
                    
                </tr>
            </tbody>
        </table>

        <button class="btn-contattami"> Contattami </button>

    </div>
</body>
</html>
